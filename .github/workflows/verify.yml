name: Verify

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for version-intent checks
        required: true
        type: string
      expected_head_sha:
        description: Exact Changesets pull request head commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI keeps only the critical checks, split so that each job runs in about two minutes. The release
# gate (scripts/release-gate.mjs) runs the full suites, every browser engine, and target conformance.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint source
        run: pnpm lint:check

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # Prettier keeps a result only for a file whose content, Prettier version, Node version, and
      # options match a passing check. The key adds the lockfile and the Prettier config, so a
      # plugin or config change starts from an empty cache.
      - name: Restore Prettier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prettier.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'prettier.config.mjs') }}-
      - name: Check formatting
        run: pnpm format:check

  types:
    name: Types and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify dispatched head
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and test ownership
        run: pnpm exec turbo typecheck --filter='!svelte-demo' && pnpm runtime:generate:typecheck && pnpm test:homes && pnpm direction:inventory --self-test > /dev/null
      - name: Check release metadata
        run: pnpm styled:versions:check && pnpm primitive:versions:check && pnpm runtime:docs:metadata:check
      - name: Verify Styled Component Version Intent
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: pnpm styled:versions:check --base "${{ inputs.base_sha || github.event.pull_request.base.sha }}"
      - name: Verify Primitive Component Version Intent
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: pnpm primitive:versions:check --base "${{ inputs.base_sha || github.event.pull_request.base.sha }}"

  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Node suites
        run: pnpm test:node && pnpm runtime:test:unit && pnpm react:test:ssr && pnpm --filter=@starwind-ui/vue test:run && pnpm direction:stage:test

  contracts:
    name: Adapter contracts and registry
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Check adapter contracts and registry
        run: pnpm runtime:generate:test:ci

  drift:
    name: Generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate Runtime adapters and CLI registries
        run: pnpm runtime:generate:ci
      - name: Reject Generated Drift
        run: git diff --exit-code

  build:
    name: Build and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shipping packages
        run: pnpm exec turbo build --filter=@starwind-ui/runtime --filter=@starwind-ui/react --filter=@starwind-ui/vue --filter=@starwind-ui/svelte --filter=starwind
      - name: Reject build changes to tracked files
        run: git diff --exit-code
      - name: Check CLI package size
        run: pnpm --filter=starwind package:check
      # The Svelte suite reads the built Runtime and Svelte packages, so it runs after the build.
      - name: Check the built Svelte package
        run: pnpm --filter=@starwind-ui/svelte test:run
      # The Svelte demo checks its types against the built Runtime and Svelte packages, so it runs
      # here, where turbo reuses this job's build.
      - name: Check Svelte demo types
        run: pnpm exec turbo typecheck --filter=svelte-demo

  runtime-browser:
    name: Runtime browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome, which every CI browser suite launches through
      # Playwright's chrome channel. Install it only on an image that lacks it.
      - name: Install Google Chrome when the runner lacks it
        run: test -x /opt/google/chrome/chrome || pnpm exec playwright install --with-deps chrome
      - name: Run Runtime browser suite in Chrome
        run: pnpm runtime:test:browser

  adapter-browser:
    name: Adapter browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true
      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome, which every CI browser suite launches through
      # Playwright's chrome channel. Install it only on an image that lacks it.
      - name: Install Google Chrome when the runner lacks it
        run: test -x /opt/google/chrome/chrome || pnpm exec playwright install --with-deps chrome
      - name: Run adapter browser suites in Chrome
        run: pnpm react:test:browser && pnpm vue:test:browser:ci && pnpm exec vitest run --config packages/vue/tests/popover/vitest.config.ts --project=browser
      - name: Check Form parity across frameworks
        run: pnpm test:form-parity

  verify:
    name: Verify
    if: always()
    needs:
      - lint
      - format
      - types
      - node-tests
      - contracts
      - drift
      - build
      - runtime-browser
      - adapter-browser
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification gate
        env:
          CHECK_RESULTS: ${{ join(needs.*.result, ',') }}
        run: >-
          node -e "process.exit(process.env.CHECK_RESULTS === 'success,success,success,success,success,success,success,success,success' ? 0 : 1)"

name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect version materialization
    runs-on: ubuntu-latest
    outputs:
      versioned: ${{ steps.changes.outputs.versioned }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Detect merged Version Packages candidate
        id: changes
        shell: bash
        run: |
          git diff --name-status "${GITHUB_SHA}^" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^D[[:space:]]+\.changeset/[^/]+\.md$' "$RUNNER_TEMP/changed-files.txt" &&
             grep -Eq '^M[[:space:]]+packages/(astro|cli|react|runtime)/package\.json$' "$RUNNER_TEMP/changed-files.txt"; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "versioned=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify
    needs: scope
    if: needs.scope.outputs.versioned == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      private_adapters: false

  release:
    name: Release
    needs:
      - scope
      - verify
    if: always() && needs.scope.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        # checkout@6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        # pnpm/action-setup@v6.0.8
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          cache: true

      - name: Setup Node.js 24
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Changesets treats nested directories as legacy v1 changesets. The
      # custom version command consumes these temporary staging directories.
      - name: Stage Registry Component Intents
        run: pnpm styled:versions:stage && pnpm primitive:versions:stage

      - name: Create Release Pull Request
        # changesets/action@v1.8.0
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b
        with:
          commitMode: github-api
          version: pnpm release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

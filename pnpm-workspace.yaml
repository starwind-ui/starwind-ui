packages:
  - packages/*
  - apps/*
# Resolve exact release dependencies to the matching local package before publication.
linkWorkspacePackages: true
preferWorkspacePackages: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
peerDependencyRules:
  allowAny:
    - "astro"
    - "vite"

resolutionMode: highest

# 2 day minimum release age
minimumReleaseAge: 2880
minimumReleaseAgeStrict: true

# allow starwind related packages and others I created
minimumReleaseAgeExclude:
  - "starwind"
  - "@starwind-ui/*"
  # below packages are missing the "time" field
  - "@tailwindcss/oxide"
  - "@astrojs/markdown-remark"
  - js-yaml@4.3.1
  - svgo@4.0.2
  - fast-uri@3.1.5
  - sharp@0.35.0

overrides:
  ajv@>=6.0.0 <7.0.0: 6.14.0
  brace-expansion@<2.0.0: 1.1.18
  brace-expansion@>=4.0.0 <5.0.9: 5.0.9
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  js-yaml@>=3.0.0 <3.15.1: 3.15.1
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  nanoid@<3.3.18: 3.3.18
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  svgo@>=4.0.0 <4.0.2: ^4.0.2
  yaml@>=2.0.0 <2.8.3: 2.9.0

patchedDependencies:
  '@changesets/assemble-release-plan@6.0.10': scripts/portable-runtime/patches/@changesets__assemble-release-plan@6.0.10.patch

packages:
  - packages/*
  - apps/*
# Resolve exact release dependencies to the matching local package before publication.
linkWorkspacePackages: true
preferWorkspacePackages: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
peerDependencyRules:
  allowAny:
    - "astro"
    - "vite"

resolutionMode: highest

# 2 day minimum release age
minimumReleaseAge: 2880
minimumReleaseAgeStrict: true

# allow starwind related packages and others I created
minimumReleaseAgeExclude:
  - "starwind"
  - "@starwind-ui/*"
  # below packages are missing the "time" field
  - "@tailwindcss/oxide"
  - "@astrojs/markdown-remark"
  - js-yaml@4.3.2
  - svgo@4.1.0
  - sharp@0.35.5
  # security patch published inside the release age window
  - http-cache-semantics@4.3.0

overrides:
  # Scoped security updates for upstream ranges that still select vulnerable releases.
  "@sveltejs/kit>cookie": 0.7.2
  "@playform/compress>deepmerge-ts": 8.0.2
  "@playform/pipe>deepmerge-ts": 8.0.2
  "tsup>esbuild": 0.28.2
  ajv@>=6.0.0 <7.0.0: 6.14.0
  brace-expansion@<2.0.0: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  devalue@<5.9.3: ^5.9.3
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  http-cache-semantics@<=4.2.0: ^4.3.0
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  nanoid@<3.3.18: 3.3.18
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.5: ^0.35.5
  smol-toml@<1.8.1: ^1.8.1
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  yaml@>=2.0.0 <2.8.3: 2.9.0

patchedDependencies:
  '@changesets/assemble-release-plan@6.0.10': scripts/portable-runtime/patches/@changesets__assemble-release-plan@6.0.10.patch

packages:
  - packages/*
  - apps/*
onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
peerDependencyRules:
  allowAny:
    - "astro"
    - "vite"

resolutionMode: highest

# 2 day minimum release age
minimumReleaseAge: 2880
minimumReleaseAgeStrict: true

# allow starwind related packages and others I created
minimumReleaseAgeExclude:
  - "starwind"
  - "@starwind-ui/*"
  # below packages are missing the "time" field
  - "@tailwindcss/oxide"
  - "@astrojs/markdown-remark"
  - js-yaml@4.3.1
  - svgo@4.0.2
  - fast-uri@3.1.5
  - sharp@0.35.0

overrides:
  ajv@>=6.0.0 <7.0.0: 6.12.6
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  nanoid@<3.3.17: 3.3.17
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  svgo@>=4.0.0 <4.0.2: ^4.0.2

patchedDependencies:
  '@changesets/assemble-release-plan@6.0.10': scripts/portable-runtime/patches/@changesets__assemble-release-plan@6.0.10.patch
